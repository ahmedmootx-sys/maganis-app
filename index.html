<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Bunyan (بُنْيَان): مدربك الرياضي وخبير التغذية على جهازك. كل بياناتك تُحفظ محلياً فقط."
    />
    <meta name="theme-color" content="#181818" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; media-src 'self' https: data: blob:; connect-src 'self' data: blob: https://api.github.com;"
    />
    <link rel="icon" type="image/png" href="./branding/app-icon.png" />
    <link rel="apple-touch-icon" href="./branding/app-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Bunyan</title>
  </head>

  <body>
    <div id="root">
      <div
        style="
          background-color: #181818;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(246, 176, 94, 0.22);
            border-top-color: #ea6a15;
            animation: spin 0.8s linear infinite;
          "
        ></div>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
